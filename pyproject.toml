[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-148"
version = "0.1.0"
description = "Exact-rational joint release planning with reusable noisy statistics and sequential budget accounting"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
privacy-budget = "privacy_budget.cli:main"
privacy-budget-release = "privacy_budget.release_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
